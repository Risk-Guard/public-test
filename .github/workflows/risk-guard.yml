name: Risk Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release asset URL
        id: asset
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/Risk-Guard/oss-risk-guard/releases/latest -o release.json
          echo "tag: $(jq -r '.tag_name' release.json)"
          echo "assets:"
          jq -r '.assets[].name' release.json | sed 's/^/  - /'
          url=$(jq -r '.assets[] | select(.name | test("linux-amd64\\.tar\\.gz$")) | .browser_download_url' release.json)
          if [ -z "$url" ]; then
            echo "::error::no linux-amd64 asset found in latest release"
            exit 1
          fi
          echo "selected: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download
        run: |
          set -euo pipefail
          curl -fsSL -o risk-guard.tar.gz "${{ steps.asset.outputs.url }}"
          ls -lh risk-guard.tar.gz

      - name: Extract
        run: |
          set -euo pipefail
          tar -xzvf risk-guard.tar.gz
          chmod +x ./risk-guard
          file ./risk-guard

      - name: Run Risk Guard
        run: ./risk-guard ./ --github
